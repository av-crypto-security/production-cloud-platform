name: Publish MinIO Recovery Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: av-crypto-security
  BINARY_RELEASE_TAG: minio-recovery-binaries-v1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download recovery binaries from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BINARY_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/minio-recovery-assets" \
            --pattern minio-binary \
            --pattern mc-binary \
            --pattern recovery-binaries.sha256

          cp "$RUNNER_TEMP/minio-recovery-assets/minio-binary" recovery/minio/
          cp "$RUNNER_TEMP/minio-recovery-assets/mc-binary" recovery/minio/
          cp "$RUNNER_TEMP/minio-recovery-assets/recovery-binaries.sha256" \
            "$RUNNER_TEMP/recovery-binaries.sha256"

          cd recovery/minio
          sha256sum -c "$RUNNER_TEMP/recovery-binaries.sha256"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MinIO Server recovery image
        uses: docker/build-push-action@v6
        with:
          context: recovery/minio
          file: recovery/minio/Dockerfile.minio
          push: true
          tags: ghcr.io/av-crypto-security/minio-recovery:RELEASE.2024-12-18T13-15-44Z

      - name: Build and push MinIO Client recovery image
        uses: docker/build-push-action@v6
        with:
          context: recovery/minio
          file: recovery/minio/Dockerfile.mc
          push: true
          tags: ghcr.io/av-crypto-security/mc-recovery:RELEASE.2024-11-21T17-21-54Z
