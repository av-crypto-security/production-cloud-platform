apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ingestion-api
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: ingestion-api

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}

  endpoints:
    - port: http
      path: /metrics
      interval: 15s
