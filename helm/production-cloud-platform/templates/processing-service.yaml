apiVersion: v1
kind: Service
metadata:
  name: processing-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: processing-service
spec:
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
  selector:
    app: processing-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.processing.replicaCount }}
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing-service
          image: "{{ .Values.processing.image.repository }}:{{ .Values.processing.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8001
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telemetry-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-secret
                  key: POSTGRES_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: RABBITMQ_PORT
            - name: RABBITMQ_EXCHANGE
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: RABBITMQ_EXCHANGE
            - name: RABBITMQ_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: RABBITMQ_QUEUE
            - name: RABBITMQ_ROUTING_KEY
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: RABBITMQ_ROUTING_KEY
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: RABBITMQ_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
