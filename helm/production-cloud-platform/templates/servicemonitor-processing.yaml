apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: processing-service
  namespace: {{ .Release.Namespace }}
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: processing-service

  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}

  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
