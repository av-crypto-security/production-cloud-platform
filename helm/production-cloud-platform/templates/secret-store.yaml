apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kubernetes-source
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: secret-source
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-kubernetes-reader
