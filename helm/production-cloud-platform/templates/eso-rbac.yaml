apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-kubernetes-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/component: secret-provider
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-source-reader
  namespace: secret-source
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-source-reader
  namespace: secret-source
subjects:
  - kind: ServiceAccount
    name: eso-kubernetes-reader
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-source-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-selfsubjectrulesreview
rules:
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-selfsubjectrulesreview
subjects:
  - kind: ServiceAccount
    name: eso-kubernetes-reader
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-selfsubjectrulesreview
