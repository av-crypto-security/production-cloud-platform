ingestion:
  replicaCount: 1
  image:
    repository: ghcr.io/av-crypto-security/ingestion-api
    tag: v1.3.0


processing:
  replicaCount: 1
  image:
    repository: ghcr.io/av-crypto-security/processing-service
    tag: v1.4.0
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 50


simulator:
  replicaCount: 1
  image:
    repository: ghcr.io/av-crypto-security/simulator
    tag: v1.0.0


postgres:
  image:
    repository: postgres
    tag: "16"
  storage: 10Gi

  host: postgres-service
  database: telemetry


postgresExporter:
  image:
    repository: prometheuscommunity/postgres-exporter
    tag: v0.17.1

  replicaCount: 1

  datasource:
    uri: postgres-service:5432/telemetry?sslmode=disable

  service:
    port: 9187

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

rabbitmq:
  image:
    repository: rabbitmq
    tag: 4.1.8-management
    pullPolicy: IfNotPresent

  replicaCount: 1

  persistence:
    storageClass: standard
    size: 2Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
