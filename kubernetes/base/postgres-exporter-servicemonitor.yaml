apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: telemetry-system
  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: postgres-exporter

  namespaceSelector:
    matchNames:
      - telemetry-system

  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
