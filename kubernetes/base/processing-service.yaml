apiVersion: v1
kind: Service
metadata:
  name: processing-service
  namespace: telemetry-system
spec:
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
  selector:
    app: processing-service
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-service
  namespace: telemetry-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-service
  template:
    metadata:
      labels:
        app: processing-service
    spec:
      containers:
        - name: processing-service
          image: ghcr.io/av-crypto-security/processing-service:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 8001
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: POSTGRES_HOST
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: telemetry-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telemetry-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
