apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: telemetry-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.17.1
          imagePullPolicy: IfNotPresent

          env:
            - name: DATA_SOURCE_URI
              value: "postgres-service:5432/telemetry?sslmode=disable"

            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: telemetry-secret
                  key: POSTGRES_USER

            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: telemetry-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: metrics
              containerPort: 9187

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
